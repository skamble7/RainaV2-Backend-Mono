[project]
name = "artifact-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "motor>=3.5",
  "orjson>=3.10",
  "jsonpatch>=1.33",
  "aio-pika>=9.4",      # ← keep if you plan to migrate to aio-pika
  "pika>=1.3",          # ← currently used in logs; keep unless fully migrated
  "httpx>=0.27",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  # NEW: enable strict JSON Schema validation at runtime
  "fastjsonschema>=2.19.1",
  "jsonschema>=4.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
