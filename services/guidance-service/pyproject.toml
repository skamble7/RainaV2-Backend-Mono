[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guidance-service"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "aio-pika>=9.4.1",
  "markdown>=3.6",
  "weasyprint>=62.3",
  "openai>=1.40.0",
  "motor>=3.5.0",            # <-- NEW (async MongoDB driver)
  "pymongo>=4.8.0",          # <-- Optional explicit (Motor pins this, but safe to include)
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
